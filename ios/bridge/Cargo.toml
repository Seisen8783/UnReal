[package]
name = "ac_bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "ac_bridge"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ac_bridge_cli"
path = "src/bin/ac_bridge_cli.rs"

[dependencies]
idevice = { version = "0.1.68", default-features = false, features = [
    "rustls",
    "rustcrypto",
    "tcp",
    "usbmuxd",
    "core_device_proxy",
    "tunnel_tcp_stack",
    "rsd",
    "dvt",
    "location_simulation",
    "heartbeat",
    "amfi",
    "mobile_image_mounter",
    "cryptexd",
    "tss",
] }
plist = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net"] }
tracing = "0.1"
